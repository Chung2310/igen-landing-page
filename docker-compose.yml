version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igen-app
    restart: always
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://db:27017/igentech
      - MONGODB_AUTH_SOURCE=admin
    networks:
      - default_network
networks:
  default_network:
    external: true