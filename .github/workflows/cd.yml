name: CD (Continuous Deployment)

on:
  push:
    branches: [ develop, production ]

# Không cancel deploy đang chạy giữa chừng; push mới sẽ xếp hàng chờ
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─── Bước 1: Lint & Typecheck — deploy chỉ chạy khi code sạch ─────────────
  checks:
    name: Lint & Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [ backend, frontend ]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: ${{ matrix.app }}/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

  # ─── Bước 2: Build & push image (một lần duy nhất) ────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [ checks ]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Bước 3a: Deploy STAGING (branch: develop) ────────────────────────────
  deploy-staging:
    name: Deploy Staging VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ build-push ]
    if: github.ref_name == 'develop'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Staging VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-ldp/staging"

      - name: Deploy via SSH to Staging VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            TARGET_DIR="/opt/igen-ldp/staging"
            IMAGE_TAG="develop"
            CONTAINER_NAME="igen-ldp-staging"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Ghi cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"

            # Kéo image mới TRƯỚC, rồi mới thay container — downtime chỉ vài giây
            # thay vì chết suốt thời gian pull như khi down trước
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml pull
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --remove-orphans

            # Health check: chờ tối đa 60s cho app sẵn sàng
            ok=""
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.yml exec -T app wget -qO- http://127.0.0.1:5001/api/v1/health >/dev/null 2>&1; then
                echo "✅ Health check OK (lần thử $i)"
                ok=1
                break
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "❌ Health check FAILED — logs gần nhất:"
              docker compose -f docker-compose.yml logs --tail=100 app
              exit 1
            fi

            # Dọn image cũ không dùng để tránh đầy disk VPS
            docker image prune -f

  # ─── Bước 3b: Deploy PRODUCTION (branch: production) ──────────────────────
  deploy-production:
    name: Deploy Production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ build-push ]
    if: github.ref_name == 'production'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Production VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          source: "docker-compose.yml"
          target: "/opt/igen-ldp/production"

      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_PROD }}
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || '22' }}
          envs: ENV_FILE_CONTENT
          script: |
            set -e
            TARGET_DIR="/opt/igen-ldp/production"
            IMAGE_TAG="production"
            CONTAINER_NAME="igen-ldp-production"

            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Ghi cấu hình từ GitHub Secrets vào file .env cục bộ
            echo "$ENV_FILE_CONTENT" > .env

            # Đăng nhập vào GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export COMPOSE_PROJECT_NAME="$CONTAINER_NAME"

            # Kéo image mới TRƯỚC, rồi mới thay container — downtime chỉ vài giây
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml pull
            IMAGE_TAG="$IMAGE_TAG" CONTAINER_NAME="$CONTAINER_NAME" docker compose -f docker-compose.yml up -d --remove-orphans

            # Health check: chờ tối đa 60s cho app sẵn sàng
            ok=""
            for i in $(seq 1 12); do
              if docker compose -f docker-compose.yml exec -T app wget -qO- http://127.0.0.1:5001/api/v1/health >/dev/null 2>&1; then
                echo "✅ Health check OK (lần thử $i)"
                ok=1
                break
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "❌ Health check FAILED — logs gần nhất:"
              docker compose -f docker-compose.yml logs --tail=100 app
              exit 1
            fi

            # Dọn image cũ không dùng để tránh đầy disk VPS
            docker image prune -f
