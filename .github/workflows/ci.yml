name: CI (Pull Request Checks)

# Chỉ chạy trên PR — push lên develop/production đã được kiểm tra đầy đủ trong cd.yml,
# tránh build Docker image trùng lặp 2 lần cho cùng một commit.
on:
  pull_request:
    branches: [ develop, production ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─── Lint & Typecheck (backend + frontend chạy song song) ─────────────────
  lint:
    name: Lint & Typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [ backend, frontend ]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: ${{ matrix.app }}/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

  # ─── Build Docker image (dry-run, chỉ khi lint pass) ──────────────────────
  build-app:
    name: Build Docker Image (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ lint ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: igen-ldp:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
