name: CI (Integration Test)

on:
  push:
    branches: [ develop, production ]
  pull_request:
    branches: [ develop, production ]

jobs:

  # ─── Job 1: Lint & Typecheck Backend ──────────────────────────────────────
  lint-backend:
    name: Lint Backend (ESLint + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: backend/yarn.lock

      - name: Install backend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint backend
        run: yarn lint

      - name: Typecheck backend
        run: yarn tsc --noEmit

  # ─── Job 2: Lint & Typecheck Frontend ─────────────────────────────────────
  lint-frontend:
    name: Lint Frontend (ESLint + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        run: yarn lint

      - name: Typecheck frontend
        run: yarn tsc --noEmit

  # ─── Job 3: Build (chỉ chạy khi cả 2 lint đều pass) ──────────────────────
  build-app:
    name: Build Docker Image (dry-run)
    runs-on: ubuntu-latest
    needs: [ lint-backend, lint-frontend ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: igen-ldp:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
